services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: "${RESTART_POLICY}"
    env_file:
      - .env
    command:
      - sh
      - -c
      - uv run alembic upgrade head && exec uv run uvicorn app.main:app --host ${API_HOST} --port ${API_PORT}
    ports:
      - "${API_PORT}:${API_PORT}"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: "${POSTGRES_IMAGE}"
    restart: "${RESTART_POLICY}"
    env_file:
      - .env
    environment:
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: "${POSTGRES_DB}"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_v2:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: "${POSTGRES_HEALTHCHECK_INTERVAL}"
      timeout: "${POSTGRES_HEALTHCHECK_TIMEOUT}"
      retries: ${POSTGRES_HEALTHCHECK_RETRIES}

volumes:
  postgres_data_v2:
